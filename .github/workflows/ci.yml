name: Frontend checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: accordbridge
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: accordbridge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U accordbridge -d accordbridge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://accordbridge:ci-only-password@127.0.0.1:5432/accordbridge_test
      FRONTEND_ORIGIN: http://127.0.0.1:3100
      STELLAR_TESTNET_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: accordbridge-frontend
    steps:
      - uses: actions/checkout@v4
        with:
          path: accordbridge-frontend
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: accordbridge-labs/accordbridge-backend
          # Reviewed API baseline; update deliberately for cross-repository changes.
          ref: 39ac0b658290c835bd4f71ccb2b8af3992640141
          path: accordbridge-backend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Prepare isolated backend
        working-directory: accordbridge-backend
        run: |
          npm ci
          npm run build
          touch .env.test
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:workspace
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: workspace-failure-evidence
          path: accordbridge-frontend/test-results/
          retention-days: 7
